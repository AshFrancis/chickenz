name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('services/prover/wasm/Cargo.lock', 'services/prover/core/Cargo.toml', 'services/prover/wasm/Cargo.toml') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM
        run: pnpm build:wasm

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint docs
        run: pnpm lint:docs

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build client
        run: pnpm --filter @chickenz/client build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ts
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('services/prover/wasm/Cargo.lock', 'services/prover/core/Cargo.toml', 'services/prover/wasm/Cargo.toml') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build WASM
        run: pnpm build:wasm

      - name: Build client
        run: pnpm --filter @chickenz/client build

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ts, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        server:
          - { ip: "178.156.244.26", region: "us",   domain: "us.chickenz.io" }
          - { ip: "89.167.92.60",   region: "eu",   domain: "eu.chickenz.io" }
          - { ip: "5.223.61.107",   region: "asia", domain: "asia.chickenz.io" }
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('services/prover/wasm/Cargo.lock', 'services/prover/core/Cargo.toml', 'services/prover/wasm/Cargo.toml') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM
        run: pnpm build:wasm

      - name: Build client
        run: pnpm --filter @chickenz/client build

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # printf preserves newlines exactly (echo with expansion can corrupt the key)
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Verify key is well-formed before proceeding (fails fast with clear message)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H ${{ matrix.server.ip }} >> ~/.ssh/known_hosts

      - name: Upload client → ${{ matrix.server.region }}
        run: |
          ssh root@${{ matrix.server.ip }} "mkdir -p /root/chickenz/services/server/public"
          scp -r services/server/public/* root@${{ matrix.server.ip }}:/root/chickenz/services/server/public/

      - name: Upload WASM → ${{ matrix.server.region }}
        run: |
          ssh root@${{ matrix.server.ip }} "mkdir -p /root/chickenz/services/prover/wasm/pkg"
          scp services/prover/wasm/pkg/chickenz_wasm_bg.wasm \
              services/prover/wasm/pkg/chickenz_wasm.js \
              services/prover/wasm/pkg/chickenz_wasm.d.ts \
              root@${{ matrix.server.ip }}:/root/chickenz/services/prover/wasm/pkg/

      - name: Pull & install → ${{ matrix.server.region }}
        run: |
          ssh root@${{ matrix.server.ip }} "cd /root/chickenz && git pull origin main 2>&1 | tail -3 && pnpm install --frozen-lockfile 2>&1 | tail -3"

      - name: Restart → ${{ matrix.server.region }}
        run: ssh root@${{ matrix.server.ip }} "systemctl restart chickenz"

      - name: Verify ${{ matrix.server.region }} is up
        run: |
          sleep 4
          curl --retry 8 --retry-delay 3 --retry-connrefused -sf https://${{ matrix.server.domain }}/api/ping

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prover
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('services/prover/Cargo.lock', 'services/prover/**/Cargo.toml') }}
          restore-keys: cargo-rust-${{ runner.os }}-

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check
