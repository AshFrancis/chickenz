name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('services/prover/wasm/Cargo.lock', 'services/prover/core/Cargo.toml', 'services/prover/wasm/Cargo.toml') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint docs
        run: pnpm lint:docs

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build WASM
        run: pnpm build:wasm

      - name: Build client
        run: pnpm --filter @chickenz/client build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prover
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('services/prover/Cargo.lock', 'services/prover/**/Cargo.toml') }}
          restore-keys: cargo-rust-${{ runner.os }}-

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check
